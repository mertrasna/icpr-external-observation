        "B",
        "C",
        "D",
        "A"
      ],
      "pinned_order_on_even_days": [
        "A",
        "D",
        "C",
        "B"
      ]
    },
    "evening": {
      "pinned_order_on_odd_days": [
        "D",
        "C",
        "B",
        "A"
      ],
      "pinned_order_on_even_days": [
        "A",
        "B",
        "C",
        "D"
      ]
    },
    "pinned_blocks": {
      "A": {
