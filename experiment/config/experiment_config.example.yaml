    "target_accepted_per_pinned_block": null,
    "separate_unpinned_and_pinned_outputs": true,
    "selective_backfill_forbidden": true
  },
  "launch_gates": {
    "G1": "configuration and ground-truth freeze",
    "G2": "dependencies, inputs, pins, feeds, and dated mapping readiness",
    "G3": "freshness pilot and privileged mechanism validation",
    "G4": "hash-verified end-to-end smoke reconstruction before rehearsal"
  }
}
